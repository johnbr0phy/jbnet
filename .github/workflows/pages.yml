# Static site → GitHub Pages (one job, no Jekyll).
# Replaces the flaky automatic pages-build-deployment pipeline.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; new push cancels the previous in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish only what the site needs (keeps the artifact small & simple).
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html CNAME favicon.ico _site/
          cp -R fonts images videos _site/
          # Tell Pages not to run Jekyll on the artifact
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
